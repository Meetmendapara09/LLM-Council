[project]
name = "llm-council"
version = "0.1.0"
description = "LLM Council - multi-model deliberation app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.53.0",
    "python-dotenv>=1.2.4",
    "httpx>=0.27.0",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
