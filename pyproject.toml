[project]
name = "llm-council"
version = "0.1.0"
description = "LLM Council - multi-model deliberation app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.53.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.27.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
